spring.application.name=transporter-lane-assignment
server.port=${PORT:8080}
# render does the https in front of the app, trust its forwarded headers so redirects and swagger use https
server.forward-headers-strategy=framework

# in-memory h2, the data is gone when the process restarts. submit the input again after that
spring.datasource.url=jdbc:h2:mem:transporters;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# 5000.75 has to be rejected (not cut to 5000) and "5000" as text must not pass for a number
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

# few request threads, each parsed body sits in memory so this caps what a burst can use
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
# cut off clients that stop sending after 8s (uploads too), otherwise a few stalled connections
# can hold every thread, even the one the health check needs
server.tomcat.connection-timeout=8s

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# solver budgets are in lane evaluations, not seconds. sized for the small free host (about a fifth of a cpu),
# so a few seconds at worst. raise them on bigger hardware
transporter.solver.work-budget=25000000
transporter.solver.seed-work-budget=10000000
transporter.solver.coverage-work-budget=20000000
# size caps for a 512 MB host, the brief's examples only have 5 to 10 lanes
transporter.limits.max-lanes=2000
transporter.limits.max-transporters=200
transporter.limits.max-quotes=10000
# lanes x transporters is the solver's table size, 8 bytes a cell
transporter.limits.max-matrix-cells=200000
transporter.limits.max-body-bytes=1048576
